[project]
name = "serverinka-guardian"
version = "1.0.0"
description = "Telegram Bot sebagai pusat kendali VPS Linux dan server pribadi"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Serverinka Guardian Team" }]
requires-python = ">=3.12"
keywords = ["telegram", "bot", "vps", "linux", "server", "management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "python-telegram-bot[job-queue]>=21.0,<22.0",
    "aiosqlite>=0.21.0",
    "APScheduler>=3.10.0,<4.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-psutil",
]

[project.scripts]
guardian = "guardian.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "ANN"]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN204",  # Missing return type annotation for special method
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=guardian --cov-report=term-missing"

[tool.coverage.run]
source = ["guardian"]
omit = ["tests/*", "guardian/migrations/*"]

[tool.coverage.report]
fail_under = 70
